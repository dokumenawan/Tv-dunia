<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Dunia</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080d18;
  --panel: #121c2d;
  --blue: #398bff;
  --text: #f4f7ff;
  --muted: #a8b5ca;
  --border: #263650;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}
header {
  padding: 22px 18px;
  background: #101a2b;
  border-bottom: 1px solid var(--border);
}
.brand { font-size: 25px; font-weight: 800; }
.brand span { color: var(--blue); }
header p { color: var(--muted); margin-bottom: 0; }
main { padding: 20px 16px; max-width: 900px; margin: auto; }
h2 { font-size: 19px; }
.channels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 14px;
}
.channels > p { grid-column: 1 / -1; margin: 0; line-height: 1.6; overflow-wrap: anywhere; }
.card {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 16px;
  padding: 18px 12px;
  color: var(--text);
  text-align: center;
  cursor: pointer;
  min-width: 0;
  font: inherit;
}
.card:active, .card:focus-visible, .card.active { border-color: var(--blue); }
.card.active { box-shadow: 0 0 0 1px var(--blue); }
.logo {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  margin: auto auto 12px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #eef3fa;
  color: #16213a;
  font-weight: 900;
  font-size: 14px;
  padding: 4px;
}
.logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
.card small {
  color: var(--muted);
  display: block;
  margin-top: 6px;
}
#playerContainer {
  margin-top: 24px;
  padding: 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
}
video {
  display: block;
  width: 100%;
  max-width: 800px;
  max-height: 65vh;
  margin: auto;
  background: #000;
  border-radius: 10px;
}
#playerStatus {
  overflow-wrap: anywhere;
  line-height: 1.6;
}
#technicalError {
  color: #ffd18a;
  font-size: 13px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.actions button {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #1b2a42;
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
footer {
  color: var(--muted);
  text-align: center;
  padding: 24px;
}
</style>
</head>
<body>
<header>
  <div class="brand">TV <span>DUNIA</span></div>
  <p>Temukan siaran dari berbagai negara.</p>
</header>

<main>
  <h2>Saluran Indonesia</h2>
  <div class="channels" id="channels">
    <p id="listStatus" aria-live="polite">Memuat daftar channel...</p>
  </div>

  <section id="playerContainer" hidden>
    <h2 id="playerTitle">Pemutar TV</h2>
    <video id="player" controls playsinline></video>
    <p id="playerStatus" aria-live="polite"></p>
    <p id="technicalError"></p>
    <div class="actions">
      <button id="retryButton" type="button">Coba lagi</button>
      <button id="openStreamButton" type="button">Buka URL stream</button>
    </div>
  </section>
</main>

<footer>TV Dunia · Pemutar siaran</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
"use strict";

/* ====== Pengaturan ====== */
const CHANNEL_FILES = ["Channels.json", "channels.json"]; // dicoba berurutan
const START_TIMEOUT_MS = 20000; // batas waktu menunggu siaran mulai
const MAX_NETWORK_RETRY = 3;
const MAX_MEDIA_RETRY = 2;

/* ====== Elemen ====== */
const listEl = document.getElementById("channels");
const listStatus = document.getElementById("listStatus");
const container = document.getElementById("playerContainer");
const video = document.getElementById("player");
const titleEl = document.getElementById("playerTitle");
const playerStatus = document.getElementById("playerStatus");
const technicalError = document.getElementById("technicalError");
const retryButton = document.getElementById("retryButton");
const openStreamButton = document.getElementById("openStreamButton");

/* ====== State ====== */
let channels = [];
let currentChannel = null;
let hlsInstance = null;
let sessionId = 0;      // penanda sesi putar, untuk mengabaikan event usang
let startTimer = null;
let cards = [];

/* ====== Utilitas ====== */
function setStatus(text) {
  playerStatus.textContent = text || "";
}

function showTechnicalError(text) {
  technicalError.textContent = text || "";
}

function clearStartTimer() {
  if (startTimer) {
    clearTimeout(startTimer);
    startTimer = null;
  }
}

function setActiveCard(channel) {
  cards.forEach(function(item) {
    item.element.classList.toggle("active", item.channel === channel);
  });
}

function destroyPlayer() {
  clearStartTimer();

  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  video.onerror = null;
  video.pause();
  video.removeAttribute("src");
  video.load();
}

function describeHlsError(data, channel) {
  const response = data.response || {};
  const code = response.code || "tidak tersedia";
  const details = data.details || "tidak tersedia";
  const type = data.type || "tidak tersedia";
  const requestUrl = data.url || channel.streamUrl || "";

  let message = "Stream gagal dimuat.";

  if (details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR) {
    message = response.code
      ? "Playlist gagal diambil (server menjawab HTTP " + response.code + "). Link stream mungkin sudah mati."
      : "Playlist gagal diambil. Server kemungkinan tidak mengizinkan akses dari browser (CORS) atau sedang mati.";
  } else if (details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT) {
    message = "Permintaan playlist melewati batas waktu.";
  } else if (details === Hls.ErrorDetails.MANIFEST_PARSING_ERROR) {
    message = "Playlist diterima tetapi formatnya tidak valid.";
  } else if (type === Hls.ErrorTypes.NETWORK_ERROR) {
    message = "Terjadi masalah jaringan saat mengambil stream.";
  } else if (type === Hls.ErrorTypes.MEDIA_ERROR) {
    message = "Playlist terbaca, tetapi media gagal diputar.";
  }

  setStatus(message);

  showTechnicalError(
    "Detail: " + details +
    "\nJenis: " + type +
    "\nHTTP: " + code +
    "\nURL: " + requestUrl +
    (response.text ? "\nRespons: " + response.text : "") +
    (data.error && data.error.message ? "\nError: " + data.error.message : "")
  );
}

/* ====== Pemutar ====== */
function playChannel(channel) {
  currentChannel = channel;
  sessionId += 1;
  const mySession = sessionId;

  const url = channel.streamUrl;

  container.hidden = false;
  titleEl.textContent = channel.name;
  setActiveCard(channel);
  showTechnicalError("");
  container.scrollIntoView({ behavior: "smooth", block: "start" });

  destroyPlayer();

  if (!url) {
    setStatus("URL stream belum tersedia.");
    return;
  }

  if (location.protocol === "https:" && /^http:\/\//i.test(url)) {
    setStatus("Stream ini memakai http, sedangkan situs memakai https, jadi diblokir browser.");
    showTechnicalError("URL: " + url + "\nSolusi: pakai versi https dari stream ini, atau nonaktifkan channelnya.");
    return;
  }

  setStatus("Memuat siaran...");

  startTimer = setTimeout(function() {
    if (mySession !== sessionId) return;
    setStatus("Siaran belum mulai setelah " + (START_TIMEOUT_MS / 1000) + " detik. Tekan \"Coba lagi\" atau cek URL stream.");
  }, START_TIMEOUT_MS);

  video.addEventListener("playing", function onPlaying() {
    if (mySession !== sessionId) return;
    clearStartTimer();
    setStatus("Sedang menyiarkan.");
    showTechnicalError("");
  }, { once: true });

  if (window.Hls && Hls.isSupported()) {
    let networkRetries = 0;
    let mediaRetries = 0;

    const headers = channel.headers || {};

    const hls = new Hls({
      manifestLoadingTimeOut: 15000,
      manifestLoadingMaxRetry: 2,
      levelLoadingTimeOut: 15000,
      fragLoadingTimeOut: 25000,
      xhrSetup: function(xhr) {
        for (const [key, value] of Object.entries(headers)) {
          try {
            xhr.setRequestHeader(key, String(value));
          } catch (error) {
            console.warn("Header tidak dapat dipasang:", key, error);
          }
        }
      }
    });

    hlsInstance = hls;

    hls.on(Hls.Events.MEDIA_ATTACHED, function() {
      if (mySession !== sessionId) return;
      hls.loadSource(url);
    });

    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      if (mySession !== sessionId) return;
      setStatus("Playlist berhasil dibaca. Memulai siaran...");
      showTechnicalError("");

      video.play().catch(function() {
        setStatus("Playlist terbaca. Tekan tombol Play untuk memulai.");
      });
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
      if (mySession !== sessionId) return;

      console.error("Detail error HLS:", {
        channel: channel.name,
        details: data.details,
        type: data.type,
        fatal: data.fatal,
        response: data.response,
        url: data.url,
        error: data.error
      });

      if (!data.fatal) return;

      if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetries < MAX_MEDIA_RETRY) {
        mediaRetries += 1;
        setStatus("Gangguan media, mencoba memulihkan (" + mediaRetries + "/" + MAX_MEDIA_RETRY + ")...");
        try {
          hls.recoverMediaError();
        } catch (error) {
          console.error("Pemulihan media gagal:", error);
        }
        return;
      }

      if (data.type === Hls.ErrorTypes.NETWORK_ERROR && networkRetries < MAX_NETWORK_RETRY) {
        networkRetries += 1;
        setStatus("Jaringan terganggu, mencoba lagi (" + networkRetries + "/" + MAX_NETWORK_RETRY + ")...");
        setTimeout(function() {
          if (mySession !== sessionId) return;
          try {
            hls.startLoad();
          } catch (error) {
            console.error("Muat ulang gagal:", error);
          }
        }, 1500 * networkRetries);
        return;
      }

      clearStartTimer();
      describeHlsError(data, channel);
      hls.destroy();
      if (hlsInstance === hls) hlsInstance = null;
    });

    hls.attachMedia(video);

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.onerror = function() {
      if (mySession !== sessionId) return;
      const mediaError = video.error;
      clearStartTimer();
      setStatus("Browser gagal memutar stream.");
      showTechnicalError(
        "Kode media: " + (mediaError && mediaError.code ? mediaError.code : "tidak tersedia") +
        "\nURL: " + url
      );
    };

    video.src = url;

    video.play().catch(function(error) {
      if (mySession !== sessionId) return;
      setStatus("Tekan tombol Play atau periksa akses stream.");
      showTechnicalError(error && error.message ? error.message : "");
    });

  } else {
    clearStartTimer();
    setStatus("Browser ini tidak mendukung pemutaran HLS.");
    showTechnicalError("Browser tidak mendukung hls.js maupun pemutaran HLS bawaan.");
  }
}

/* ====== Daftar channel ====== */
async function fetchChannelData() {
  const problems = [];

  for (const file of CHANNEL_FILES) {
    try {
      const response = await fetch(file + "?v=" + Date.now(), { cache: "no-store" });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return await response.json();
    } catch (error) {
      problems.push(file + ": " + error.message);
    }
  }

  throw new Error(problems.join(" | "));
}

/* ====== Logo ====== */
function showInitials(logoEl, name) {
  const words = String(name || "?").split(/\s+/).filter(Boolean);
  let text = words.map(function(word) { return word[0]; }).join("").slice(0, 3).toUpperCase();
  if (words.length === 1) text = words[0].slice(0, 3).toUpperCase();

  let hash = 0;
  for (const ch of String(name)) hash = (hash * 31 + ch.charCodeAt(0)) % 360;

  logoEl.style.background = "hsl(" + hash + ", 55%, 38%)";
  logoEl.style.color = "#fff";
  logoEl.style.fontSize = "22px";
  logoEl.replaceChildren(document.createTextNode(text));
}

function setLogo(item, urls) {
  const list = urls.filter(Boolean);
  const logo = item.logoEl;

  function showName() {
    showInitials(logo, item.channel.name);
  }

  if (!list.length) {
    showName();
    return;
  }

  let index = 0;
  const img = document.createElement("img");
  img.alt = item.channel.name;
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  img.addEventListener("error", function() {
    index += 1;
    if (index < list.length) {
      img.src = list[index];
    } else {
      showName();
    }
  });
  logo.style.background = "";
  logo.style.color = "";
  logo.style.fontSize = "";
  img.src = list[0];
  logo.replaceChildren(img);
}

function buildCard(channel) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card";

  const logo = document.createElement("div");
  logo.className = "logo";

  const name = document.createElement("strong");
  name.textContent = channel.name;

  const detail = document.createElement("small");
  const isLinkOnly = !channel.streamUrl && !!channel.watchUrl;
  detail.textContent =
    [channel.country, channel.category].filter(Boolean).join(" · ") +
    (isLinkOnly ? " · Situs resmi ↗" : "");

  card.append(logo, name, detail);
  card.addEventListener("click", function() {
    if (isLinkOnly) {
      window.open(channel.watchUrl, "_blank", "noopener");
      return;
    }
    playChannel(channel);
  });

  setLogo({ channel: channel, logoEl: logo }, [channel.logo]);

  return { element: card, logoEl: logo };
}

/* ====== Logo dari Wikipedia (diambil langsung oleh browser) ====== */
const WIKI_EN = "https://en.wikipedia.org/w/api.php";
const WIKI_ID = "https://id.wikipedia.org/w/api.php";
const LOGO_CACHE_KEY = "tvdunia.wikilogos.v2";

// Nama file yang jelas bukan logo channel (ikon Wikipedia, bendera, peta, dll.)
const BAD_FILE = /(commons-logo|wikimedia|wikipedia|wiktionary|wikiquote|wikisource|wikidata|edit-|question_book|ambox|flag_of|bendera|map_of|peta|icon|symbol|text_document|crystal|folder|padlock|disambig|portal|nuvola|searchtool|speaker|ooui|lock-|merge|split|stub|increase|decrease|steady|screenshot|building|gedung|tower|studio)/i;
const WEAK_FILE = /(old|former|lama|variant|alt|wordmark|text)/i;

function wikiUrl(base, extra) {
  return base + "?" + new URLSearchParams(Object.assign({
    action: "query",
    format: "json",
    origin: "*"
  }, extra)).toString();
}

async function wikiJson(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error("HTTP " + response.status);
  }
  return response.json();
}

function compact(text) {
  return String(text || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

// Pilih file logo dari daftar gambar di artikel: nama file harus memuat nama channel
function pickLogoFile(files, channelName) {
  const wanted = compact(channelName);
  let best = "";
  let bestScore = 0;

  files.forEach(function(file) {
    const base = String(file).replace(/^[^:]+:/, "");
    if (BAD_FILE.test(base)) return;
    if (!/\.(svg|png|jpg|jpeg|webp)$/i.test(base)) return;

    const name = compact(base.replace(/\.[a-z]+$/i, ""));
    if (!wanted || !name.includes(wanted)) return;

    let score = 4;
    if (name.includes("logo")) score += 2;
    if (/\.svg$/i.test(base)) score += 1;
    if (WEAK_FILE.test(base)) score -= 2;

    const years = base.match(/(19|20)\d\d/g);
    if (years) {
      score += (Math.max.apply(null, years.map(Number)) - 1990) / 100;
    }

    if (score > bestScore) {
      bestScore = score;
      best = file;
    }
  });

  return best;
}

async function wikiFileUrl(base, fileTitle) {
  const data = await wikiJson(wikiUrl(base, {
    prop: "imageinfo",
    iiprop: "url",
    iiurlwidth: "256",
    titles: fileTitle
  }));
  const pages = Object.values((data.query || {}).pages || {});
  const info = pages[0] && pages[0].imageinfo && pages[0].imageinfo[0];
  return info ? (info.thumburl || info.url || "") : "";
}

// Ambil nama file logo dari parameter "logo" di infobox artikel (paling akurat)
async function wikiInfoboxLogoFile(base, title) {
  const data = await wikiJson(wikiUrl(base, {
    prop: "revisions",
    rvprop: "content",
    rvslots: "main",
    formatversion: "2",
    redirects: "1",
    titles: title
  }));
  const page = ((data.query || {}).pages || [])[0];
  const text = page && page.revisions && page.revisions[0] &&
    page.revisions[0].slots && page.revisions[0].slots.main &&
    page.revisions[0].slots.main.content;
  if (!text) return "";

  const match = text.match(/\|\s*logo\s*=\s*([^\n]*(?:\n(?!\s*\|)[^\n]*)*)/i);
  if (!match) return "";

  const names = match[1].match(/[^\n=|\[\]{}:]+\.(?:svg|png|jpg|jpeg|webp)/gi);
  if (!names || !names.length) return "";

  const picked = names[names.length - 1].trim();
  return picked ? "File:" + picked : "";
}

async function wikiLogoFromArticle(base, title, channelName) {
  try {
    const infoboxFile = await wikiInfoboxLogoFile(base, title);
    if (infoboxFile) {
      const infoboxUrl = await wikiFileUrl(base, infoboxFile);
      if (infoboxUrl) {
        console.info("Logo Wikipedia (infobox):", channelName, "->", title, "->", infoboxFile);
        return infoboxUrl;
      }
    }
  } catch (error) {
    console.warn("Infobox logo gagal:", channelName, error);
  }

  const data = await wikiJson(wikiUrl(base, {
    prop: "images",
    imlimit: "500",
    titles: title,
    redirects: "1"
  }));
  const page = Object.values((data.query || {}).pages || {})[0];
  if (!page || !page.images) return "";

  const file = pickLogoFile(
    page.images.map(function(image) { return image.title; }),
    channelName
  );
  if (!file) return "";

  const url = await wikiFileUrl(base, file);
  if (url) console.info("Logo Wikipedia:", channelName, "->", title, "->", file);
  return url;
}

async function wikiSearchTitles(base, queryText, channelName) {
  const data = await wikiJson(wikiUrl(base, {
    list: "search",
    srsearch: queryText,
    srlimit: "5"
  }));
  const wanted = compact(channelName);
  return ((data.query || {}).search || [])
    .map(function(result) { return result.title; })
    .filter(function(title) { return compact(title).includes(wanted); })
    .slice(0, 2);
}

async function findWikipediaLogo(channel) {
  const name = channel.name;

  if (channel.wikiFile) {
    try {
      const pinned = await wikiFileUrl(WIKI_EN, channel.wikiFile);
      if (pinned) return pinned;
    } catch (error) {
      console.warn("Logo (wikiFile) gagal:", name, error);
    }
  }

  const steps = [
    async function() {
      return { base: WIKI_EN, titles: channel.wikipedia ? [channel.wikipedia] : [] };
    },
    async function() {
      return { base: WIKI_EN, titles: await wikiSearchTitles(WIKI_EN, name + " Indonesia television", name) };
    },
    async function() {
      return { base: WIKI_ID, titles: await wikiSearchTitles(WIKI_ID, name, name) };
    }
  ];

  for (const step of steps) {
    try {
      const found = await step();
      for (const title of found.titles) {
        const url = await wikiLogoFromArticle(found.base, title, name);
        if (url) return url;
      }
    } catch (error) {
      console.warn("Logo Wikipedia gagal:", name, error);
    }
  }

  console.info("Logo Wikipedia tidak ditemukan:", name);
  return "";
}

function applyFoundLogos(found) {
  cards.forEach(function(item) {
    const url = found[item.channel.id];
    if (url) {
      setLogo(item, [url, item.channel.logo]);
    }
  });
}

async function loadWikipediaLogos() {
  const found = {};

  try {
    Object.assign(found, JSON.parse(localStorage.getItem(LOGO_CACHE_KEY) || "{}"));
  } catch (error) {
    // abaikan jika penyimpanan tidak tersedia
  }
  applyFoundLogos(found);

  const todo = cards.filter(function(item) {
    return !found[item.channel.id] && item.channel.noWikipedia !== true;
  });

  await Promise.all(todo.map(async function(item) {
    const url = await findWikipediaLogo(item.channel);
    if (url) {
      found[item.channel.id] = url;
      setLogo(item, [url, item.channel.logo]);
    }
  }));

  try {
    localStorage.setItem(LOGO_CACHE_KEY, JSON.stringify(found));
  } catch (error) {
    // abaikan jika penyimpanan tidak tersedia
  }
}

async function loadChannels() {
  try {
    const data = await fetchChannelData();
    const rawList = Array.isArray(data) ? data : data.channels;

    if (!Array.isArray(rawList)) {
      throw new Error("Properti channels tidak ditemukan atau bukan array.");
    }

    channels = rawList.filter(function(channel) {
      return channel && channel.name && channel.enabled !== false;
    });

    listEl.replaceChildren();
    cards = [];

    if (!channels.length) {
      listStatus.textContent = "Belum ada channel aktif.";
      listEl.appendChild(listStatus);
      return;
    }

    channels.forEach(function(channel) {
      const built = buildCard(channel);
      cards.push({ channel: channel, element: built.element, logoEl: built.logoEl });
      listEl.appendChild(built.element);
    });

    loadWikipediaLogos();

  } catch (error) {
    console.error("Gagal memuat daftar channel:", error);
    listStatus.textContent = "Daftar channel gagal dimuat: " + error.message;
  }
}

/* ====== Tombol ====== */
retryButton.addEventListener("click", function() {
  if (currentChannel) {
    playChannel(currentChannel);
  }
});

openStreamButton.addEventListener("click", function() {
  if (currentChannel && currentChannel.streamUrl) {
    window.open(currentChannel.streamUrl, "_blank", "noopener");
  }
});

loadChannels();
</script>
</body>
</html>
