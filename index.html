
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Dunia</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080d18;
  --panel: #121c2d;
  --blue: #398bff;
  --text: #f4f7ff;
  --muted: #a8b5ca;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}
header {
  padding: 22px 18px;
  background: #101a2b;
  border-bottom: 1px solid #26334a;
}
.brand { font-size: 25px; font-weight: 800; }
.brand span { color: var(--blue); }
header p { color: var(--muted); margin-bottom: 0; }
main { padding: 20px 16px; max-width: 900px; margin: auto; }
h2 { font-size: 19px; }
.channels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 14px;
}
.card {
  border: 1px solid #263650;
  background: var(--panel);
  border-radius: 16px;
  padding: 18px 12px;
  color: var(--text);
  text-align: center;
  cursor: pointer;
}
.card:active { border-color: var(--blue); }
.logo {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  margin: auto auto 12px;
  display: grid;
  place-items: center;
  background: #eef3fa;
  color: #16213a;
  font-weight: 900;
  font-size: 25px;
}
.card small { color: var(--muted); display: block; margin-top: 6px; }
footer { color: var(--muted); text-align: center; padding: 24px; }
</style>
</head>
<body>
<header>
  <div class="brand">TV <span>DUNIA</span></div>
  <p>Temukan siaran dari berbagai negara.</p>
</header>

<main>
  <h2>Saluran Indonesia</h2>

  <div class="channels" id="channels">
    <p id="status" aria-live="polite">
      Memuat daftar channel...
    </p>
  </div>
</main>
<footer>TV Dunia · Prototipe awal</footer>

<script>
const list = document.getElementById("channels");
const status = document.getElementById("status");

async function loadChannels() {
  try {
    const response = await fetch("Channels.json");
    if (!response.ok) throw new Error("File data tidak ditemukan");

    const data = await response.json();
    list.replaceChildren();

    const channels = data.channels.filter(channel => channel.enabled);

    if (!channels.length) {
      status.textContent = "Belum ada channel aktif.";
      return;
    }

    channels.forEach(channel => {
      const card = document.createElement("button");
      card.className = "card";

      const logo = document.createElement("div");
      logo.className = "logo";

      if (channel.logo) {
        const img = document.createElement("img");
        img.src = channel.logo;
        img.alt = channel.name;
        img.style.cssText =
          "width:100%;height:100%;object-fit:contain;border-radius:50%";
        logo.replaceChildren(img);
      } else {
        logo.textContent = channel.name;
      }

      const name = document.createElement("strong");
      name.textContent = channel.name;

      const detail = document.createElement("small");
      detail.textContent =
        `${channel.country} · ${channel.category}`;

      card.append(logo, name, detail);

      card.addEventListener("click", () => {
        const url = channel.sourceUrl || channel.streamUrl;
        if (url) window.open(url, "_blank", "noopener");
      });

      list.appendChild(card);
    });

    status.textContent = "";
  } catch (error) {
    status.textContent =
      "Daftar channel gagal dimuat. Periksa nama file dan koneksi.";
  }
}

loadChannels();
</script>

</body>
</html>
